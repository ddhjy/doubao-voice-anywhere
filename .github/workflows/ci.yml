name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      # CI 机器上没有签名证书，这一步同时验证了 build.sh 的
      # 证书自动探测 → ad-hoc 签名回退路径。
      #
      # 用 --universal 是有意的：release.yml 出的就是双架构包，
      # 这条路径只在发版时跑一次太晚，放这里每次 push 都过一遍。
      - name: Assemble .app bundle
        run: ./build.sh --universal

      - name: Verify universal binary
        run: |
          lipo -info "dist/豆包随时说.app/Contents/MacOS/DoubaoVoiceApp"
          lipo -info "dist/豆包随时说.app/Contents/Resources/mrbridge.dylib"

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict "dist/豆包随时说.app"
          plutil -lint "dist/豆包随时说.app/Contents/Info.plist"

      # DMG 打包在这里先冒烟一遍：release.yml 跑公证更贵，等到那时候才发现
      # 打包脚本坏了再修，等于白烧一轮签名和公证。
      - name: Package DMG (smoke test)
        run: |
          APP_VERSION=0.0.0-ci ./package-dmg.sh
          hdiutil attach "dist/DoubaoVoiceApp-0.0.0-ci.dmg" \
            -mountpoint "$RUNNER_TEMP/dmg" -nobrowse -quiet
          ls -l "$RUNNER_TEMP/dmg"
          hdiutil detach "$RUNNER_TEMP/dmg" -quiet
